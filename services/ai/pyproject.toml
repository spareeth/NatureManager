[project]
name = "terragarden-ai"
version = "0.0.1"
description = "Species identify service for the Terra Garden platform (see docs/AI_INTEGRATION.md)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]
# BioCLIP 2 (CPU is enough for the pilot). Install torch from the CPU index first, see the Dockerfile.
bioclip = ["torch>=2.3", "open_clip_torch>=2.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
